[workspace]
resolver = "2"
members = [
    "crates/chuk-tool-runtime",
    "crates/chuk-tool-runtime-mcp",
    "crates/chuk-tool-runtime-e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/chrishayuk/chuk-tool-runtime-rs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
rand = "0.8"
