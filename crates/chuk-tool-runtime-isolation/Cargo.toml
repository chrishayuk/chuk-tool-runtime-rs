[package]
name = "chuk-tool-runtime-isolation"
description = "OS-level sandboxing + host<->guest tool broker for running untrusted code, for chuk-tool-runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chuk-tool-runtime = { path = "../chuk-tool-runtime" }
serde_json.workspace = true
rand.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["process", "net", "io-util", "rt", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "process", "net", "io-util", "time"] }
tempfile = "3"
async-trait.workspace = true
