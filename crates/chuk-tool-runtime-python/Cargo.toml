[package]
name = "chuk-tool-runtime-python"
description = "PyO3 bindings for chuk-tool-runtime: the Rust tool-execution runtime for Python."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chuk_tool_runtime_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
chuk-tool-runtime = { path = "../chuk-tool-runtime" }
chuk-tool-runtime-mcp = { path = "../chuk-tool-runtime-mcp" }
chuk-mcp = { path = "../../../chuk-mcp-rs/crates/chuk-mcp" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }
pyo3 = { version = "0.29", features = ["abi3-py39"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pythonize = "0.29"

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
